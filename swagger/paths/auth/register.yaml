tags:
  - Auth
summary: User registration
operationId: registerUser
description: 'Create a new user'
security:
  - bearerAuth: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - name
          - email
          - password
        properties:
          _id:
            type: string
            format: objectId
            example: '66d8a90efca05bf0ee47593a'
          name:
            description: 'Username'
            type: string
            example: 'Anna Kvitka'
          email:
            description: 'Email address'
            type: string
            example: 'kvatkAnna@gmail.com'
          password:
            description: 'Password'
            type: string
            example: 'password12345'
responses:
  '201':
    description: 'User registered successfully'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: 'Successfully registered a user!'
            data:
              type: object
              properties:
                _id:
                  type: string
                  format: objectId
                  example: '66d8a90efca05bf0ee47593a'
                name:
                  type: string
                  example: 'Anna Kvitka'
                email:
                  type: string
                  example: 'kvatkAnna@gmail.com'
  '400':
    $ref: '../../components/responses/400.yaml'
  '409':
    $ref: '../../components/responses/409.yaml'
  '500':
    $ref: '../../components/responses/500.yaml'
