tags:
  - Contacts
summary: Patch contact by id
operationId: updateContact
description: Patch contact by id
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      format: objectId
      example: '65ca67e7ae7f10c88b598384'
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            description: 'Update contact name'
            type: string
            example: 'Anna Kvitka'
          phoneNumber:
            description: 'Update contact phone number'
            type: string
            example: '+380999999999'
          email:
            description: 'Update contact email'
            type: string
            example: 'kvatkAnna@gmail.com'
          isFavourite:
            description: 'What contact is favorite'
            type: boolean
            example: false
          contactType:
            description: 'Update contact type'
            type: string
            enum: ['work', 'home', 'personal']
            example: 'personal'
          photo:
            description: 'Update contatc photo'
            type: string
            format: binary
responses:
  '200':
    description: Successfully upserted a contact!
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully upserted a contact!
            data:
              type: object
              $ref: '../../../components/schemas/contact.yaml'
  '400':
    $ref: ../../../components/responses/400.yaml
  '401':
    $ref: ../../../components/responses/401.yaml
  '404':
    $ref: '../../../components/responses/404.yaml'
  '500':
    $ref: '../../../components/responses/500.yaml'
