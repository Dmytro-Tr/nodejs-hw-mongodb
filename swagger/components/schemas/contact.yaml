type: object
required:
  - name
  - phoneNumber
  - contactType
  - userId
properties:
  _id:
    description: 'Genereted id'
    type: string
    # format: objectId
    example: 65e4decdd286b30065d54af9
  name:
    description: "Contact's name"
    type: string
    example: 'Anna Kvitka'
  phoneNumber:
    description: "Contact's phone number"
    type: string
    example: '+380891234567'
  email:
    description: "Contact's email"
    type: string
    example: 'kvatkAnna@gmail.com'
  isFavourite:
    description: 'What contact is favorite'
    type: boolean
    example: false
  contactType:
    description: "Contact's type"
    type: string
    enum: ['work', 'home', 'personal']
    example: 'personal'
    default: 'personal'
  photo:
    description: 'Update contatc photo'
    type: string
    format: binary
    example: https://res.cloudinary.com/dkktk5mwk/image/upload/v1743433106/tgqlgriyh5yibvb7kkma.jpg
  userId:
    description: "Contact's id"
    type: string
    example: 65e4decdd286b30065d54af9
  createdAt:
    type: string
    format: date-time
    description: Contact created date
    example: 2011-10-10T14:48:00.000+09:00
  updatedAt:
    type: string
    format: date-time
    description: Contact created date
    example: 2011-10-10T14:48:00.000+09:00
